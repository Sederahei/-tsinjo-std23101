<form th:action="@{/don}" method="post" xmlns:th="http://www.w3.org/1999/xhtml">
    <label>Nom:</label>
    <input type="text" name="nom" required><br>

    <label>Téléphone (Vola):</label>
    <input type="text" name="telephone" required><br>

    <label>Email:</label>
    <input type="email" name="email" required><br>

    <label>Montant:</label>
    <input type="number" name="montant" min="100" required><br>

    <label>Référence Vola (pspPaymentId):</label>
    <input type="text" name="pspPaymentId" required><br>

    <button type="submit">Faire un don</button>
</form>
